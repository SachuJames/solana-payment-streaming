[package]
name = "solstream"
version = "0.1.0"
edition = "2021"
description = "SolStream: SPL token payment streaming on Solana"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "3"

[dev-dependencies]
solana-program-test = "3.1"
solana-pubkey = "3"
solana-signer = "3"
solana-keypair = "3"
solana-transaction = "3"
solana-message = "3"
solana-instruction = "3"
solana-clock = "3"
spl-token = "9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
