<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#101428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9945ff"/>
      <stop offset="1" stop-color="#14f195"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b93b8"/>
    </marker>
  </defs>

  <rect width="920" height="540" rx="14" fill="url(#bg)"/>
  <text x="460" y="40" text-anchor="middle" fill="#e6e9f5" font-size="24" font-weight="700">SolStream Architecture</text>
  <text x="460" y="62" text-anchor="middle" fill="#8b93b8" font-size="13">SPL token payment streaming on Solana</text>

  <!-- Client layer -->
  <g>
    <rect x="60" y="100" width="220" height="120" rx="10" fill="#141829" stroke="#2b3352"/>
    <text x="170" y="128" text-anchor="middle" fill="#e6e9f5" font-size="15" font-weight="600">TypeScript SDK</text>
    <text x="170" y="150" text-anchor="middle" fill="#8b93b8" font-size="12">PDA derivation</text>
    <text x="170" y="168" text-anchor="middle" fill="#8b93b8" font-size="12">instruction builders</text>
    <text x="170" y="186" text-anchor="middle" fill="#8b93b8" font-size="12">stream queries</text>
  </g>
  <g>
    <rect x="640" y="100" width="220" height="120" rx="10" fill="#141829" stroke="#2b3352"/>
    <text x="750" y="128" text-anchor="middle" fill="#e6e9f5" font-size="15" font-weight="600">React Dashboard</text>
    <text x="750" y="150" text-anchor="middle" fill="#8b93b8" font-size="12">create streams</text>
    <text x="750" y="168" text-anchor="middle" fill="#8b93b8" font-size="12">live vested balances</text>
    <text x="750" y="186" text-anchor="middle" fill="#8b93b8" font-size="12">withdraw / cancel</text>
  </g>
  <rect x="300" y="100" width="320" height="120" rx="10" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="460" y="128" text-anchor="middle" fill="#e6e9f5" font-size="15" font-weight="600">Wallets</text>
  <text x="460" y="150" text-anchor="middle" fill="#8b93b8" font-size="12">sender funds the stream</text>
  <text x="460" y="168" text-anchor="middle" fill="#8b93b8" font-size="12">recipient pulls vested tokens</text>
  <text x="460" y="186" text-anchor="middle" fill="#8b93b8" font-size="12">dev keypair, localnet only</text>

  <!-- Program -->
  <g>
    <rect x="240" y="270" width="440" height="110" rx="10" fill="#1a1430" stroke="#9945ff" stroke-width="1.5"/>
    <text x="460" y="298" text-anchor="middle" fill="#e6e9f5" font-size="15" font-weight="600">SolStream Program (native Rust)</text>
    <text x="460" y="322" text-anchor="middle" fill="#8b93b8" font-size="12">CreateStream: validate schedule, open vault, fund via CPI</text>
    <text x="460" y="340" text-anchor="middle" fill="#8b93b8" font-size="12">Withdraw: vested minus withdrawn, PDA-signed transfer</text>
    <text x="460" y="358" text-anchor="middle" fill="#8b93b8" font-size="12">CancelStream: settle both sides, close vault and stream</text>
  </g>

  <!-- Accounts -->
  <g>
    <rect x="60" y="420" width="250" height="90" rx="10" fill="#141829" stroke="#2b3352"/>
    <text x="185" y="446" text-anchor="middle" fill="#e6e9f5" font-size="14" font-weight="600">Stream PDA</text>
    <text x="185" y="466" text-anchor="middle" fill="#8b93b8" font-size="11">seeds: stream, sender,</text>
    <text x="185" y="482" text-anchor="middle" fill="#8b93b8" font-size="11">recipient, mint, nonce</text>
  </g>
  <g>
    <rect x="335" y="420" width="250" height="90" rx="10" fill="#141829" stroke="#2b3352"/>
    <text x="460" y="446" text-anchor="middle" fill="#e6e9f5" font-size="14" font-weight="600">Vault PDA</text>
    <text x="460" y="466" text-anchor="middle" fill="#8b93b8" font-size="11">SPL token account,</text>
    <text x="460" y="482" text-anchor="middle" fill="#8b93b8" font-size="11">authority: stream PDA</text>
  </g>
  <g>
    <rect x="610" y="420" width="250" height="90" rx="10" fill="#0f2b25" stroke="#14f195" stroke-width="1.2"/>
    <text x="735" y="446" text-anchor="middle" fill="#e6e9f5" font-size="14" font-weight="600">SPL Token Program</text>
    <text x="735" y="466" text-anchor="middle" fill="#8b93b8" font-size="11">transfer / initialize /</text>
    <text x="735" y="482" text-anchor="middle" fill="#8b93b8" font-size="11">close via CPI</text>
  </g>

  <!-- Arrows -->
  <line x1="170" y1="220" x2="330" y2="270" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="220" x2="590" y2="270" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="220" x2="460" y2="270" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="230" y2="420" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="380" x2="460" y2="420" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="380" x2="690" y2="420" stroke="#8b93b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
